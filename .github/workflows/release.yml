name: release
# A pushed tag vX.Y.Z becomes a GitHub release (quality.quality-release R9, R11, R21). The owner approves
# first, in project/releases/X.Y.Z.md; the tag is pushed only after that. The gate and the build run with a
# read-only token; only the last job, which runs no third-party code, may write.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The tag is on main and matches the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(node -p "require('./package.json').version")" = "$v"
          grep -q "VERSION = '$v'" src/core.js
          grep -q "^## $v\$" CHANGELOG.md
          grep -q "^- \[x\] Approved" "project/releases/$v.md"
      - run: npm install -g @anthropic-ai/claude-code@2.1.321
      - run: npm run gate
      - name: Archives and checksums
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          for t in claude codex gemini; do (cd "plugins/$t" && zip -qr "../../dist/helps-$v-$t.zip" helps); done
          (cd dist && sha256sum *.zip > SHA256SUMS)
          { awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md; echo; echo "Commit: $GITHUB_SHA"; } > dist/NOTES.md
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "helps ${GITHUB_REF_NAME#v}" --notes-file dist/NOTES.md --verify-tag
