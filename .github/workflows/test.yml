name: gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The mod tests need the Claude Code engine; it runs on Linux with Node 22, pinned (docs/TEST-STRATEGY.md).
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm install -g @anthropic-ai/claude-code@2.1.321
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run gate
      - if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npm run gate -- --without-claude
